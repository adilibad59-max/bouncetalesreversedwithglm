name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with quad-apk (docker)
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src \
            notfl3/cargo-apk cargo quad-apk build --release
      - name: List output
        run: find target -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: bounce-rs-apk
          path: target/android-artifacts/release/apk/*.apk
