[package]
name = "bounce-rs"
version = "0.1.0"
edition = "2021"
description = "Bounce Tales inspired rolling-ball platformer"
license = "MIT"

[dependencies]
macroquad = "0.4.14"

[package.metadata.android]
package = "com.bouncetales.port"
apk_name = "bounce-rs"
assets = "assets"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 21
target_sdk_version = 33

[package.metadata.android.application]
label = "Bounce Tales RS"

[profile.release]
opt-level = 3
lto = true
