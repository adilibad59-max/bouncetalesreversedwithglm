[package]
name = "bounce-rs"
version = "0.1.0"
edition = "2021"
description = "Bounce Tales inspired rolling-ball platformer"
license = "MIT"

[dependencies]
macroquad = "=0.4.14"
fontdue = "=0.9.2"

[package.metadata.android]
package_name = "com.bouncetales.port"
label = "Bounce Tales RS"
assets = "assets"
fullscreen = true
build_targets = ["aarch64-linux-android"]

[profile.release]
opt-level = 3
lto = true
